[training]
model = "gru"            # gru | lstm | tcn
size = "small"           # small | medium
mode = "eager"           # eager | tf_function | xla
epochs = 50
batch_size = 32
learning_rate = 0.001
early_stopping_patience = 5
seed = 42
window_size = 24
horizon = 1
checkpoint_dir = "checkpoints"

[benchmark]
model = "gru"
sizes = ["small", "medium"]
modes = ["eager", "tf_function", "xla"]
phases = ["train", "inference"]
iterations = 3
warmup_iterations = 1

[sink]
type = "csv"             # csv | json | influxdb

[sink.influxdb]          # only used when sink.type = "influxdb"
url = "http://localhost:8086"
token = ""
org = ""
bucket = "kasoku"

[alerts]
# XLA no-speedup warning: fires when XLA wall-clock >= eager wall-clock
xla_no_speedup = { enabled = true }

# Compile overhead warning: fires when compile overhead > ratio * steady-state wall-clock
compile_overhead = { enabled = true, ratio = 0.5 }

# XLA regression critical: fires when XLA wall-clock > multiplier * eager wall-clock
xla_regression = { enabled = true, multiplier = 1.25 }

# Throughput regression critical: fires when XLA throughput < eager throughput
throughput_regression = { enabled = true }

[slo]
# XLA speedup: eager wall-clock / XLA wall-clock >= 1.20 means XLA is 20% faster
xla_speedup = { enabled = true, target = 1.20, operator = ">=" }

# Compile overhead ratio: compile overhead / XLA wall-clock <= 0.30
compile_overhead = { enabled = true, target = 0.30, operator = "<=" }

# Throughput ratio: XLA throughput / eager throughput >= 0.90
throughput_ratio = { enabled = true, target = 0.90, operator = ">=" }

# Memory ratio: XLA peak memory / eager peak memory <= 1.10
memory_ratio = { enabled = true, target = 1.10, operator = "<=" }

[baseline]
# Per-metric regression thresholds (percent) when comparing a benchmark run
# against the stored baseline (benchmarks/baselines.json).
# A value above baseline * (1 + pct/100) is a regression unless noted.

wall_clock_seconds = { enabled = true, pct = 10 }   # higher = regression
throughput_samples_per_sec = { enabled = true, pct = 10 }   # lower = regression
compile_overhead_seconds = { enabled = true, pct = 20 }   # higher = regression (more variable)
peak_memory_mb = { enabled = true, pct = 10 }   # higher = regression

# Derived SLI ratios (computed xla vs eager within the inference phase).
xla_speedup_ratio = { enabled = true, pct = 10 }   # eager/xla; lower = regression
compile_overhead_ratio = { enabled = true, pct = 10 }   # higher = regression
throughput_ratio = { enabled = true, pct = 10 }   # xla/eager; lower = regression
memory_ratio = { enabled = true, pct = 10 }   # xla/eager; higher = regression

[accuracy]
# Forecast accuracy thresholds evaluated against held-out ground truth.
# A model fails the accuracy check when any enabled metric exceeds its threshold.
mae = { enabled = true, threshold = 2.0 }      # absolute error
mape = { enabled = true, threshold = 0.15 }    # 15% percentage error
